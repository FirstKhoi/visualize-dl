<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giải phẫu mạng nơ-ron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 3D bench fills the left, the reading panel docks right (below on phones).
   Visual grammar: thick block = has weights or changes shape, thin slab = keeps shape, pink = residual path. */
:root {
  --scene: #E7EBF0;
  --surface: #F6F8FA;
  --fg: #142030;
  --muted: #586678;
  --line: #D2D9E1;
  --grid: #C5CED8;
  --flow: #8A97A8;
  --accent: #C2255C;
  --code-bg: #ECF0F4;
  --chart-a: #C2255C; --chart-b: #1C7ED6; /* validated pair (dataviz validator): a = with shortcut / positive, b = plain / negative */
  --c-io: #66768A; --c-embed: #2F9E44; --c-attn: #7048E8; --c-linear: #1C7ED6; --c-conv: #1864AB;
  --c-norm: #0C8599; --c-act: #E67700; --c-add: #C2255C; --c-pool: #5C940D; --c-block: #3B5BDB;
  --f-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --scene: #0D1218; --surface: #121A23; --fg: #E4EAF0; --muted: #93A1B1; --line: #243142; --grid: #1D2834; --flow: #5F6E80;
    --accent: #F06595; --code-bg: #0E151D; --chart-a: #E64980; --chart-b: #339AF0;
    --c-io: #8D9BAD; --c-embed: #51CF66; --c-attn: #9775FA; --c-linear: #4DABF7; --c-conv: #339AF0;
    --c-norm: #22B8CF; --c-act: #FFA94D; --c-add: #F06595; --c-pool: #94D82D; --c-block: #748FFC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --scene: #0D1218; --surface: #121A23; --fg: #E4EAF0; --muted: #93A1B1; --line: #243142; --grid: #1D2834; --flow: #5F6E80;
  --accent: #F06595; --code-bg: #0E151D; --chart-a: #E64980; --chart-b: #339AF0;
  --c-io: #8D9BAD; --c-embed: #51CF66; --c-attn: #9775FA; --c-linear: #4DABF7; --c-conv: #339AF0;
  --c-norm: #22B8CF; --c-act: #FFA94D; --c-add: #F06595; --c-pool: #94D82D; --c-block: #748FFC;
  color-scheme: dark;
}
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } /* iPhone landscape would otherwise inflate text */
body { background: var(--scene); color: var(--fg); font: 400 14px/1.55 var(--f-ui); overflow: hidden; }
button { font-family: inherit; touch-action: manipulation; } /* no double-tap zoom on iOS */
input[type="range"], input[type="checkbox"] { accent-color: var(--accent); }
[hidden] { display: none !important; } /* our display: grid/flex rules must not override the hidden attribute (opened as a plain file there is no host reset) */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); height: 100%; }
.stage { position: relative; min-width: 0; overflow: hidden; }
.stage canvas { display: block; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; isolation: isolate; } /* CSS2DRenderer gives each label a z-index up to the label count: keep those inside the 3D view, under the home page */

.top { position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
.top > * { pointer-events: auto; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 600 13px/1 var(--f-ui); padding: 8px 12px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
#models button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--fg); box-shadow: inset 0 0 0 1px var(--accent); }
.pick { display: none; max-width: 100%; padding: 8px 10px; font: 600 13px var(--f-ui); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
#home-btn svg { display: block; }
/* home page: over the whole app until a block is opened */
.home { position: fixed; inset: 0; z-index: 5; overflow-y: auto; background: var(--scene); color: var(--fg); }
.home-in { max-width: 1080px; margin: 0 auto; padding: 40px max(20px, env(safe-area-inset-right, 0px)) 56px max(20px, env(safe-area-inset-left, 0px)); }
.home h1 { margin: 0 0 10px; font: 700 34px/1.15 var(--f-ui); letter-spacing: -0.02em; }
.home-lede { max-width: 720px; margin: 0 0 16px; font-size: 16.5px; line-height: 1.55; }
.home-links { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 0; font-size: 14px; }
.home-links a { color: var(--accent); }
.home-links .home-go { padding: 9px 14px; border-radius: 9px; background: var(--fg); color: var(--surface); font-weight: 600; text-decoration: none; }
.home h2 { margin: 36px 0 12px; font: 700 12.5px var(--f-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.paths { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.path { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.path h3 { margin: 0 0 4px; font: 700 16px var(--f-ui); }
.path p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.path ol { display: grid; gap: 5px; margin: 0; padding-left: 20px; font-size: 14px; }
.path a { color: var(--accent); text-decoration: none; }
.path a:hover { text-decoration: underline; }
.path .soon { color: var(--muted); }
.path .soon em { margin-left: 4px; padding: 0 5px; font-size: 11.5px; font-style: normal; border: 1px solid var(--line); border-radius: 5px; }
.home-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 16px; }
.hg h3 { margin: 0 0 6px; font: 600 14px var(--f-ui); }
.hg div { display: flex; flex-wrap: wrap; gap: 6px; }
.hg a { padding: 5px 10px; font-size: 13.5px; color: var(--fg); text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.hg a:hover { border-color: var(--accent); }
.home-foot { max-width: 720px; margin: 36px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
.home-foot a { color: var(--accent); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; min-width: 0; padding: 4px 8px; font-size: 13px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 10px; }
.crumbs button { border: 0; background: none; color: var(--accent); font: 500 13px/1.4 var(--f-ui); padding: 3px 5px; border-radius: 5px; cursor: pointer; }
.crumbs button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.crumbs .up { font-weight: 700; padding: 3px 8px; margin-right: 4px; border: 1px solid var(--line); }
.crumbs [aria-current] { font-weight: 600; padding: 3px 5px; }
.crumbs .sep { color: var(--muted); }
.dir { padding: 7px 11px; font: 600 12.5px/1 var(--f-ui); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.dir[aria-pressed="true"] { color: var(--surface); background: var(--accent); border-color: var(--accent); }

.bottom { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: 12px; z-index: 2; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px 16px; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: 640px; padding: 6px 10px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend i.skip { width: 16px; height: 3px; border-radius: 2px; background: var(--accent); vertical-align: 3px; }
.legend .note { flex-basis: 100%; }
.hint { margin: 0; font-size: 12px; color: var(--muted); }
.hint .touch { display: none; }
@media (hover: none) { .hint .mouse { display: none; } .hint .touch { display: inline; } }

.tag-anchor { width: 0; height: 0; }
.tag-anchor.up .tag { top: auto; bottom: 0; } /* floating box: label sits above it, clear of the row */
.tag { position: absolute; top: 0; left: 0; transform: translateX(-50%); display: grid; justify-items: center; gap: 1px; padding: 3px 7px; white-space: nowrap; pointer-events: auto; cursor: pointer;
  font: 500 12px/1.25 var(--f-ui); color: var(--fg); background: color-mix(in srgb, var(--surface) 84%, transparent); border: 1px solid var(--line); border-radius: 6px; }
.tag b { font: 500 11px var(--f-mono); color: var(--muted); }
.tag small { font: 400 10.5px/1.25 var(--f-mono); color: var(--muted); }
.tag em { font-style: normal; font-size: 10.5px; font-weight: 600; color: var(--accent); }
.tag:hover, .hover .tag { border-color: var(--fg); }
.on .tag { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.link-tag { font: 500 11px var(--f-mono); color: var(--accent); background: color-mix(in srgb, var(--scene) 80%, transparent); padding: 0 4px; border-radius: 4px; white-space: nowrap; }
.link-tag.cross { color: var(--c-attn); }

.panel { min-width: 0; overflow-y: auto; overscroll-behavior: contain; padding: 22px max(22px, env(safe-area-inset-right, 0px)) 40px 22px; background: var(--surface); border-left: 1px solid var(--line); }
.back { display: block; border: 0; background: none; color: var(--accent); font: 500 13px var(--f-ui); padding: 0; margin-bottom: 14px; cursor: pointer; }
.eyebrow { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.chip { font: 600 11px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--c); padding: 5px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 14%, transparent); }
.rep { font: 500 12px var(--f-mono); color: var(--muted); }
.panel h2 { margin: 0 0 4px; font: 700 22px/1.25 var(--f-ui); letter-spacing: -0.01em; text-wrap: balance; }
.shape { margin: 0 0 14px; font: 500 12.5px/1.4 var(--f-mono); color: var(--muted); }
.panel p { margin: 0; max-width: 62ch; }
.what { font-size: 15px; }
.panel section { margin-top: 22px; }
.panel h3 { margin: 0 0 8px; font: 600 11px/1.2 var(--f-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.math { overflow-x: auto; overflow-y: hidden; padding: 1px 0; }
.panel p { overflow-x: auto; overflow-y: hidden; } /* a formula inside a sentence cannot wrap: on a phone it scrolls on its own line instead of pushing the whole panel sideways */
.math + .math { margin-top: 4px; }
.kids { display: flex; flex-wrap: wrap; gap: 6px; }
.kid { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; font: 500 13px var(--f-ui); color: var(--fg); background: var(--scene); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.kid:hover { border-color: var(--accent); }
.kid i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.kids-hint { margin-bottom: 8px !important; font-size: 12.5px; color: var(--muted); }
.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; }
.code pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 12.5px/1.6 var(--f-mono); }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.sec-head h3 { margin: 0; }
.copy { padding: 3px 8px; font: 500 11.5px var(--f-ui); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.copy:hover { color: var(--fg); }
.live-ctl { display: grid; gap: 8px; margin-bottom: 4px; }
.sent { display: flex; flex-wrap: wrap; gap: 6px; }
.tok { display: inline-flex; align-items: center; gap: 2px; padding: 3px 3px 3px 10px; font: 600 13px var(--f-ui); background: color-mix(in srgb, var(--accent) 14%, transparent); border-radius: 999px; }
.tok button { border: 0; background: none; color: var(--muted); font: 600 15px/1 var(--f-ui); padding: 2px 6px; border-radius: 999px; cursor: pointer; }
.tok button:disabled { visibility: hidden; }
.vocab { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12.5px; color: var(--muted); }
.vocab span { margin-right: 4px; }
.vocab button { padding: 3px 8px; font: 500 12.5px var(--f-ui); color: var(--fg); background: var(--scene); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.vocab button:hover:not(:disabled) { border-color: var(--accent); }
.vocab button:disabled { opacity: 0.4; cursor: default; }
.live label { display: flex; gap: 8px; align-items: center; font-size: 13.5px; cursor: pointer; }
.mat { overflow-x: auto; margin-top: 12px; }
.mat-title { margin-bottom: 4px; font: 600 12px var(--f-mono); color: var(--muted); }
.mat table { border-collapse: separate; border-spacing: 2px; font: 500 12px var(--f-mono); font-variant-numeric: tabular-nums; }
.mat th { padding: 2px 4px; font: 500 11px var(--f-ui); color: var(--muted); white-space: nowrap; }
.mat td { min-width: 38px; padding: 4px 5px; text-align: right; border-radius: 4px; }
.mat td.neg { text-align: center; color: var(--muted); background: var(--line); }
.reading { display: grid; gap: 2px; margin-top: 10px !important; font-size: 13px; }
.vocab button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }

/* links between blocks, sources, copy-link */
.linkbtn { margin-left: auto; padding: 3px 8px; font: 500 11.5px var(--f-ui); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.linkbtn:hover { color: var(--fg); }
.linkout { width: 100%; margin: -4px 0 10px; padding: 6px 8px; font: 12px var(--f-mono); color: var(--fg); background: var(--scene); border: 1px solid var(--line); border-radius: 6px; }
.xlinks { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.xl { display: block; padding: 6px 10px; text-align: left; font: 400 13px/1.4 var(--f-ui); color: var(--fg); background: var(--scene); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.xl:hover { border-color: var(--accent); }
.xl b { font-weight: 600; }
.xl span { color: var(--muted); font-family: var(--f-mono); font-size: 12px; }
.refs { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; }
.refs a { color: var(--accent); }
.refs span { color: var(--muted); }
.untranslated { margin: -6px 0 12px !important; padding: 6px 10px; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; }
.feedback { margin-top: 26px !important; font-size: 13px; }
.feedback a { color: var(--muted); }
.feedback a:hover { color: var(--accent); }

/* block search (Cmd+F / Ctrl+F): a compact field in the top bar that widens when used; results drop down only once you type */
.search { position: relative; }
.search input { width: 150px; padding: 7px 10px; font: 500 13px var(--f-ui); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; transition: width 0.15s; }
.search input::placeholder { color: var(--muted); }
.search input:focus { width: min(280px, 70vw); outline: 2px solid var(--accent); outline-offset: 0; }
.search-list { position: absolute; top: calc(100% + 6px); left: 0; z-index: 5; display: grid; gap: 2px; width: min(420px, calc(100vw - 32px)); max-height: min(60vh, 460px); overflow-y: auto; overscroll-behavior: contain; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgb(0 0 0 / 0.16); }
@media (hover: none) { .search input { font-size: 16px; } } /* iOS zooms into fields under 16px */
@media (prefers-reduced-motion: reduce) { .search input { transition: none; } }
.fr { display: grid; gap: 1px; padding: 7px 10px; text-align: left; color: var(--fg); background: none; border: 0; border-radius: 6px; cursor: pointer; }
.fr[aria-selected="true"], .fr:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.fr-name { font: 600 14px var(--f-ui); }
.fr-name i { font: 500 12px var(--f-mono); color: var(--muted); font-style: normal; }
.fr-trail { font-size: 12px; color: var(--muted); }
.finder-empty { margin: 0; padding: 4px 10px; font-size: 12.5px; color: var(--muted); }

/* toy convolution */
.cwrap { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; margin-top: 12px; }
.cgrid { border-collapse: separate; border-spacing: 2px; }
.cscroll { overflow-x: auto; } /* the 8×8 output grid is wider than the panel of a phone held sideways */
.cgrid td { padding: 0; }
.cgrid button, .cgrid span { display: grid; place-items: center; width: 26px; height: 26px; padding: 0; font: 500 11px var(--f-mono); font-variant-numeric: tabular-nums; color: var(--fg); background: var(--scene); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
.cgrid.in button.on { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.cgrid.in button.rf { outline: 2px solid var(--accent); outline-offset: -1px; }
.cgrid.out button { width: 38px; }
.cgrid.out button.sel { outline: 2px solid var(--fg); outline-offset: -1px; }
.cgrid span { cursor: default; width: 34px; }
.sgrid button { width: 15px; height: 15px; border-radius: 3px; }
.sgrid button.sel { outline: 2px solid var(--fg); outline-offset: 0; }
.mgrid { border-spacing: 1px; }
.mgrid span { width: 9px; height: 9px; border: 0; border-radius: 1px; background: color-mix(in srgb, var(--chart-a) 55%, var(--surface)); }
.mgrid span.off { background: var(--line); }

/* gradient experiment */
.sl { display: grid; gap: 2px; font-size: 13px; }
.sl span { display: flex; justify-content: space-between; gap: 8px; }
.sl output { font: 600 12.5px var(--f-mono); }
.sl input { width: 100%; margin: 0; }
.chart { position: relative; margin-top: 12px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .legend-row { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 6px; font-size: 12.5px; color: var(--muted); }
.chart .legend-row i { display: inline-block; width: 16px; height: 3px; margin-right: 6px; vertical-align: 3px; border-radius: 2px; }
.tip { position: absolute; top: 0; padding: 5px 8px; font: 500 12px/1.4 var(--f-mono); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 8px rgb(0 0 0 / 0.12); pointer-events: none; white-space: nowrap; }
.exp details { margin-top: 10px; font-size: 13px; }
.exp summary { cursor: pointer; color: var(--accent); }
.exp details table { margin-top: 6px; border-collapse: collapse; font: 500 12px var(--f-mono); font-variant-numeric: tabular-nums; }
.exp details td, .exp details th { padding: 2px 10px 2px 0; text-align: right; }
.exp details th { font: 500 11px var(--f-ui); color: var(--muted); }

/* training lab */
.lab-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.labbtn { padding: 6px 12px; font: 600 13px var(--f-ui); color: var(--fg); background: var(--scene); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.labbtn.primary { color: var(--surface); background: var(--accent); border-color: var(--accent); }
.labbtn:hover { border-color: var(--accent); }
#lab-canvas, #diff-canvas { display: block; width: min(100%, 280px); height: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; }
.lab-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px !important; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lab-stats b { color: var(--fg); font-family: var(--f-mono); }
/* toy sampling: one row per word; faint bar = probability before top-p, solid bar = after */
.smp-prompt { margin-top: 10px !important; font-size: 15px; }
.smp-prompt b { color: var(--accent); }
.dist { display: grid; gap: 3px; margin: 8px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
.live label.sl { display: grid; gap: 2px; } /* not the checkbox rows of the attention demo */
.drow { display: grid; grid-template-columns: 5em 1fr 3.2em 2.2em; gap: 8px; align-items: center; }
.drow .dw { font-weight: 600; white-space: nowrap; }
.dbar { position: relative; height: 10px; background: var(--scene); border-radius: 3px; overflow: hidden; }
.dbar i { position: absolute; inset: 0 auto 0 0; background: var(--chart-a); border-radius: 3px; }
.dbar i.pre { background: var(--line); }
.drow .dp, .drow .dn { font: 12px var(--f-mono); text-align: right; color: var(--muted); }
.drow.cut .dw { color: var(--muted); text-decoration: line-through; }
/* the CNN tab: drawing pad, what the network sees, its answer, feature maps */
.ct-io { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin: 10px 0; }

<script type="module">
import * as THREE from 'three';

// ---------- language: Vietnamese, or English wherever i18n/en.js has the text (that file loads only for English) ----------
// ?lang=en|vi chooses and is remembered; without it, the last choice, else Vietnamese

// the demos' Vietnamese toy words (attention, sampling, the lab's datasets), glossed word by word; the code keeps the Vietnamese keys
const GLOSS = L({}, {
  'mèo': 'cat', 'chuột': 'mouse', 'cơm': 'rice', 'đen': 'black', 'đói': 'hungry', 'đuổi': 'chases', 'ăn': 'eats', 'nó': 'it',
  'danh từ': 'noun', 'động từ': 'verb', 'tính từ': 'adjective', 'đại từ': 'pronoun', 'con vật': 'animal',
  'Hôm nay trời rất': 'Today the weather is very', 'đẹp': 'nice', 'nóng': 'hot', 'lạnh': 'cold', 'nắng': 'sunny', 'oi': 'muggy', 'mát': 'cool',

if (EN) document.title = 'Neural Network Anatomy';

// ---------- scene ----------
const CAT = L({ io: 'Dữ liệu', shape: 'Đổi shape', embed: 'Embedding', attn: 'Attention', linear: 'Tuyến tính', conv: 'Tích chập', norm: 'Chuẩn hoá', act: 'Kích hoạt', add: 'Cộng residual', pool: 'Pooling', block: 'Khối' },
  { io: 'Data', shape: 'Reshape', embed: 'Embedding', attn: 'Attention', linear: 'Linear', conv: 'Convolution', norm: 'Normalization', act: 'Activation', add: 'Residual add', pool: 'Pooling', block: 'Block' });

const SLABS = new Set(['act', 'norm', 'add']);
const V3 = THREE.Vector3;
const GAP = 0.95, STUB = 0.9;
const VIEW = new V3(0.12, 0.5, 1).normalize(); // near-frontal so rows read left → right; elevation keeps the 3D

const view = document.getElementById('view'), panel = document.getElementById('panel'), home = document.getElementById('home');

const renderer = new THREE.WebGLRenderer({ antialias: true });

const css = new CSS2DRenderer();

const scene = new THREE.Scene();

const controls = new OrbitControls(camera, renderer.domElement);

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(6, 12, 8);
scene.add(sun);

let theme, grid;
function readTheme() {

  grid = new THREE.GridHelper(80, 80, theme.grid, theme.grid);
  grid.position.y = y;
  scene.add(grid);
}

// ---------- level building ----------
const sizeOf = nd => nd.size || (SLABS.has(nd.cat) ? SLAB : [1.2, 1.5, 1.3]);
const track = (o, m) => { m.userData.base = m.opacity; m.userData.dw = m.depthWrite; o.mats.push(m); return m; };

function makeItem(it, stagger, base, up) {
  const nd = it.node, col = theme.cat(nd.cat);
  const ball = nd.size === BALL;
  const geo = ball ? new THREE.SphereGeometry(it.half.x, 32, 16) : new THREE.BoxGeometry(it.size.x, it.size.y, it.size.z);

  it.root = new THREE.Group();
  it.root.position.copy(it.pos);
  it.body = new THREE.Group();
  it.root.add(it.body);
  it.body.add(it.mesh);

    g.position.set(0.06 * k, 0.06 * k, -0.18 * k);
    g.userData.item = it;
    it.body.add(g);
  }

  const lshape = tr(nd.lshape) ?? (nd.shape && !(SLABS.has(nd.cat) && !nd.children) ? tr(nd.shape).split('→').pop().trim() : '');
  it.el = document.createElement('div');
  it.el.className = 'tag-anchor' + (up ? ' up' : '');
  it.el.innerHTML = `<button class="tag" type="button" tabindex="-1"><span>${nameOf(nd)}${nd.repeat > 1 ? ` <b>×${nd.repeat}</b>` : ''}</span>`
    + (lshape ? `<small>${lshape}</small>` : '')
    + (nd.children ? `<em>▸ ${nd.hint ? tr(nd.hint) : nd.children.length + L(' phần', ' parts')}</em>` : '') + '</button>';
  it.el.firstChild.addEventListener('click', () => pick(it));
  const label = new CSS2DObject(it.el);
  label.position.set(0, up ? base + 0.25 : base - 0.25 - (stagger && it.i % 2 ? 1.3 : 0), 0);

    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 384;
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    const sprite = new THREE.Sprite(track(it, new THREE.SpriteMaterial({ map: tex, transparent: true })));
    sprite.scale.set(1.3, 1.3, 1);
    sprite.position.y = it.half.y + 0.95;
    it.root.add(sprite);
    it.live = { ctx: canvas.getContext('2d'), tex };
  }
}

const NRM ={ r: [1, 0, 0], l: [-1, 0, 0], t: [0, 1, 0], d: [0, -1, 0], f: [0, 0, 1], b: [0, 0, -1] };
// Endpoint -> point p and direction n. Start: curve leaves along n. End: curve arrives against n.
function endpoint(e, items) {
  if (e.gap !== undefined) {
    const it = items[e.gap], prev = items.slice(0, e.gap).reverse().find(x => !x.node.float);
    const x = prev ? (prev.pos.x + prev.half.x + it.pos.x - it.half.x) / 2 : it.pos.x - it.half.x - STUB / 2;
    return { p: new V3(x, it.pos.y, it.pos.z), n: new V3(0, 1, 0) };
  }
  const it = items[e.i ?? e.stub ?? e.ext], s = new V3(...NRM[e.s]);
  const face = it.pos.clone().add(s.clone().multiply(it.half));

  if (e.stub !== undefined) return { p: face.addScaledVector(s, e.d ?? STUB), n: s.negate() };
  if (e.ext !== undefined) return { p: face.addScaledVector(s, e.d), n: s.negate() };
  return { p: face, n: s };
}

function linksOf(node, items) {
  if (node.links) return node.links;
  const row = items.filter(it => !it.node.float).map(it => it.i), L = [];
  if (!node.noIn) L.push({ a: { stub: row[0], s: 'l' }, b: { i: row[0], s: 'l' } });
  for (let j = 0; j + 1 < row.length; j++) L.push({ a: { i: row[j], s: 'r' }, b: { i: row[j + 1], s: 'l' } });
  L.push({ a: { i: row.at(-1), s: 'r' }, b: { stub: row.at(-1), s: 'r' }, label: node.outLabel });
  for (const [a, b, label] of node.skips || []) L.push({ a: { gap: a }, b: { i: b, s: 't' }, kind: 'skip', label });

}

function makeLink(l, items) {
  const A = endpoint(l.a, items), B = endpoint(l.b, items);

  if (l.kind === 'skip' || l.arc) { // residual arc (or any link with arc: true): up, over the skipped blocks, down into the target
    const hy = Math.max(...items.filter(it => it.i >= l.a.gap && it.i <= l.b.i).map(it => it.pos.y + it.half.y + (it.live ? 1.6 : 0))) + 0.75; // clear the live heatmaps too

  const col = { cross: theme.cat('attn'), loop: theme.cat('act'), concat: theme.cat('embed'), skip: theme.accent, short: theme.accent }[l.kind] || theme.flow;
  const thick = l.kind && l.kind !== 'branch';

  o.root.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 64, thick ? 0.034 : 0.024, 8), track(o, new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.85 }))));

function buildLevel(node) {

  const items = node.children.map((k, i) => ({ node: k, i, size: new V3(...sizeOf(k)), pos: new V3() }));
  if (node.layout === 'manual') items.forEach(it => it.pos.set(...it.node.pos));

    row.forEach(it => it.pos.x -= (x - gap) / 2);

    const up = row && !!it.node.float;

    group.add(it.root);
  });
  const links = linksOf(node, items).map(l => makeLink(l, items));
  links.forEach(l => group.add(l.root));
  const bbox = new THREE.Box3();
  items.forEach(it => { bbox.expandByPoint(it.pos.clone().sub(it.half)); bbox.expandByPoint(it.pos.clone().add(it.half)); });
  links.forEach(l => l.curve.getPoints(16).forEach(p => bbox.expandByPoint(p)));
  items.forEach(it => it.live && bbox.expandByPoint(it.pos.clone().add(new V3(0, it.half.y + 1.65, 0))));
  const floor = Math.min(...items.map(it => it.pos.y - it.half.y)) - 0.35;
  bbox.min.y -= stagger ? 2.3 : 0.9; // room for labels hanging under the blocks
  const L = { node, group, items, links, bbox, floor };
  paintLive(L);
  return L;
}

function setOp(o, a) {
  o.alpha = a;
  for (const m of o.mats) m.opacity = m.userData.base * a;
  o.root.visible = a > 0.005;
  if (o.el) { o.el.style.opacity = a; o.el.style.visibility = a < 0.05 ? 'hidden' : ''; }
}

function dispose(L) {
  scene.remove(L.group);
  L.group.traverse(o => { o.geometry?.dispose(); o.material?.map?.dispose(); o.material?.dispose(); if (o.isCSS2DObject) o.element.remove(); });
}

// ---------- animation ----------
const tweens = new Set();
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
const sub = (k, a, b) => Math.min(1, Math.max(0, (k - a) / (b - a)));
const tween = (ms, fn) => new Promise(done => tweens.add({ t0: performance.now(), ms: reduce ? 0 : ms, fn, done }));

function fit(L, ms = 900) {
  const c = L.bbox.getCenter(new V3()), s = L.bbox.getSize(new V3());
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect);
  // the top bar covers part of the view: fit into the free band below it (matters on short phone screens)
  const vh = view.clientHeight || 1, ov = Math.min(vh * 0.45, Math.max(0, topBar.getBoundingClientRect().bottom - view.getBoundingClientRect().top + 6)), free = 1 - ov / vh;
  const d = Math.max(s.y / 2 / Math.tan(vf) / free, s.x / 2 / Math.tan(hf)) * (camera.aspect < 1 ? 1.3 : 1.12) + s.z / 2; // labels overhang the boxes; narrow screens need more room
  c.y += (ov / vh) * d * Math.tan(vf); // lifting the target moves the content down into the free band
  const toPos =c.clone().addScaledVector(VIEW, d), fromPos = camera.position.clone(), fromT = controls.target.clone(), fromY = grid.position.y;
  return tween(ms, k => {
    const e = ease(k);
    camera.position.lerpVectors(fromPos, toPos, e);
    controls.target.lerpVectors(fromT, c, e);
    grid.position.y = fromY + (L.floor - fromY) * e;
  });
}

function emerge(L, k) { // children fly out of the origin (the parent's spot), staggered
  const N = L.items.length;
  L.items.forEach((it, j) => {
    const e = ease(sub(k, (j / N) * 0.35, (j / N) * 0.35 + 0.65));
    it.root.position.copy(it.pos).multiplyScalar(e);
    it.body.scale.setScalar(0.12 + 0.88 * e);
    setOp(it, e);
  });
  L.links.forEach(l => setOp(l, sub(k, 0.75, 1)));
}

const depthWrite = (it, on) => it.mats.forEach(m => m.depthWrite = on && m.userData.dw);

// ---------- navigation ----------
let path = [], level = null, sel = null, hover = null, busy = false;

// opens a model at any depth: idx = child indices from the root; a leaf at the end of idx gets selected
async function enter(model, idx = []) {
  busy = true;
  lab.running = false; // a training run belongs to the lab on screen
  const old = level;
  path = [MODELS[model]]; sel = hover = null;
  for (const i of idx) { const k = path.at(-1).children?.[i]; if (!k) break; path.push(k); }
  const leaf = path.length > 1 && !path.at(-1).children ? path.pop() : null;
  level = buildLevel(path.at(-1));
  scene.add(level.group);
  emerge(level, 0);
  ui();
  if (old) {
    fit(level);
    await tween(350, k => { old.items.forEach(o => setOp(o, 1 - k)); old.links.forEach(l => setOp(l, 1 - k)); });
    dispose(old);
  } else fit(level, 0);
  await tween(1100, k => emerge(level, k));
  busy = false;
  if (leaf) select(level.items.find(it => it.node === leaf));
}

async function drillIn(it) {
  busy = true;
  const old = level, c = it.pos.clone();
  path.push(it.node); sel = hover = null;
  level = buildLevel(it.node);
  scene.add(level.group);
  emerge(level, 0);
  const shell = level.bbox.getSize(new V3()).divide(it.size); // parent box grows into a shell around its children
  depthWrite(it, false);
  ui();
  fit(level, 1200);
  await tween(1200, k => {
    const a = ease(sub(k, 0, 0.45));
    old.group.position.copy(c).multiplyScalar(-a);
    old.items.forEach(o => o !== it && setOp(o, 1 - a));
    old.links.forEach(l => setOp(l, 1 - a));
    it.body.scale.set(1, 1, 1).lerp(shell, ease(sub(k, 0.15, 0.8)));
    setOp(it, 1 - sub(k, 0.3, 0.9));
    if (it.el) it.el.style.opacity = 1 - a;
    emerge(level, sub(k, 0.3, 1));
  });
  dispose(old);
  busy = false;
}

async function goTo(depth) {
  if (busy || depth < 0 || depth >= path.length - 1) return;
  busy = true;
  const old = level, child = path[depth + 1];
  path.length = depth + 1; sel = hover = null;
  level = buildLevel(path[depth]);
  scene.add(level.group);
  const it = level.items.find(x => x.node === child), c = it.pos.clone();
  const shell = old.bbox.getSize(new V3()).divide(it.size);
  level.items.forEach(o => setOp(o, 0));
  level.links.forEach(l => setOp(l, 0));
  depthWrite(it, false);
  ui();
  fit(level, 1100);
  await tween(1100, k => {
    emerge(old, 1 - sub(k, 0, 0.6));
    it.body.scale.copy(shell).lerp(new V3(1, 1, 1), ease(sub(k, 0.15, 0.75)));
    setOp(it, sub(k, 0.1, 0.6));
    const a = ease(sub(k, 0.5, 1));
    level.group.position.copy(c).multiplyScalar(a - 1);
    level.items.forEach(o => o !== it && setOp(o, a));
    level.links.forEach(l => setOp(l, a));
  });
  depthWrite(it, true);
  dispose(old);
  busy = false;
}

const glow = (it, k) => it && it.mesh.material.emissive.copy(theme.cat(it.node.cat)).multiplyScalar(k);

function select(it) {
  if (sel) { glow(sel, 0); sel.el.classList.remove('on'); }
  sel = it;
  if (it) { glow(it, theme.dark ? 0.45 : 0.3); it.el.classList.add('on'); }
  syncOwners();
  renderPanel();
  saveLoc();
  syncNav();
}

function pick(it) {
  if (busy || !it || it.alpha < 0.6) return;
  if (it.node.children) drillIn(it);
  else select(it === sel ? null : it);
}

function setHover(it) {
  if (hover === it) return;
  if (hover && hover !== sel) glow(hover, 0);
  hover?.el.classList.remove('hover');
  hover = it;
  if (it && it !== sel) glow(it, 0.18);
  it?.el.classList.add('hover');
  renderer.domElement.style.cursor = it ? 'pointer' : '';
}

const conv = { img: TOYCONV.IMAGES['Cạnh dọc'].map(r => [...r]), kernel: 'Sobel dọc', pad: 1, stride: 1, owner: null, pick: null };
const MAXW = 6;
// every live key a block can carry (node.live): the matrix or picture painted above it in 3D, the panel section that

const fmtV = v => v === -Infinity ? '−∞' : Number.isInteger(v) ? String(v) : v.toFixed(2);
const vmax = M => Math.max(1e-9, ...M.flat().filter(Number.isFinite).map(Math.abs));
const convRun = () => TOYCONV.run(conv.img, TOYCONV.KERNELS[conv.kernel], conv);
// diverging: positive → chart-a, negative → chart-b, zero = the surface (neutral midpoint)
const cellBg = (v, max) => `background: color-mix(in srgb, var(${v < 0 ? '--chart-b' : '--chart-a'}) ${Math.round(Math.abs(v) / max * 55)}%, transparent)`;

function paintLive(L) {
  const memo = {}, tmp = new THREE.Color();
  for (const it of L.items) if (it.live) {
    const kind = LIVE[it.node.live], { ctx, tex } = it.live, S = ctx.canvas.width;
    ctx.clearRect(0, 0, S, S);
    if (kind.image) { ctx.drawImage(kind.image(it.node), 0, 0, S, S); tex.needsUpdate = true; continue; }
    const M = kind.matrix(memo), max = vmax(M);
    const cell = Math.floor((S - 8) / Math.max(M.length, M[0].length)), ox = (S - cell * M[0].length) / 2, oy = (S - cell * M.length) / 2;
    ctx.font = `600 ${Math.round(cell * 0.3)}px "JetBrains Mono", monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    M.forEach((row, i) => row.forEach((v, j) => {
      const t = Number.isFinite(v) ? Math.abs(v) / max : 0;
      ctx.fillStyle = Number.isFinite(v) ? tmp.lerpColors(theme.surface, v < 0 ? theme.chartB : theme.chartA, t).getStyle() : theme.line.getStyle();
      ctx.fillRect(ox + j * cell + 2, oy + i * cell + 2, cell - 4, cell - 4);
      ctx.fillStyle = (t > 0.55 ? theme.surface : theme.fg).getStyle();
      if (cell >= 28) ctx.fillText(fmtV(v), ox + (j + 0.5) * cell, oy + (i + 0.5) * cell); // a 16×16 weight matrix is colour only
    }));
    tex.needsUpdate = true;
  }
}

const matTable = (title, M, rows, cols) => {
  const max = vmax(M);
  return `<div class="mat"><div class="mat-title">${title}</div><table><tr><th></th>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`
    + M.map((row, i) => `<tr><th>${rows[i]}</th>${row.map(v => Number.isFinite(v) ? `<td style="${cellBg(v, max)}">${fmtV(v)}</td>` : '<td class="neg">−∞</td>').join('')}</tr>`).join('') + '</table></div>';
};

function liveOut(stage) {
  const r = TOY.run(live.words, live), w = r.words.map(gloss), F = TOY.F.map(gloss), K = TOY.KD.map(gloss);
  const mats = {
    sdpa: [[L('x: đặc trưng của từng từ', 'x: the features of each word'), r.X, w, F], [L('A: trọng số attention', 'A: attention weights'), r.A, w, w], ['O = A·V: output', r.O, w, F]],
    qk: [[L('Q = x·W_Q (từ này tìm gì)', 'Q = x·W_Q (what this word looks for)'), r.Q, w, K], [L('K = x·W_K (từ này là gì)', 'K = x·W_K (what this word is)'), r.K, w, K], ['S = Q·Kᵀ', r.S, w, w]],
    scale: [[live.scale ? 'S / √3' : L('S (đang tắt chia √dₖ)', 'S (division by √dₖ is off)'), r.St, w, w]],
    mask: [[live.causal ? L('S̃ + M (mặt nạ nhân quả)', 'S̃ + M (causal mask)') : L('S̃ + M (đang tắt mặt nạ, M = 0)', 'S̃ + M (mask off, M = 0)'), r.Sm, w, w]],
    softmax: [[L('A = softmax(S̃ + M), theo hàng', 'A = softmax(S̃ + M), row by row'), r.A, w, w]],
    av: [['V = x (W_V = I)', r.V, w, F], ['O = A·V', r.O, w, F]]
  }[stage];
  const pct = v => Math.round(v * 100) + '%';
  const attn = w.map((t, i) => `<span><b>${t}</b> → ${r.A[i].map((v, j) => [v, w[j]]).sort((a, b) => b[0] - a[0]).slice(0, 2).filter(x => x[0] >= 0.05).map(([v, u]) => `${u} ${pct(v)}`).join(', ')}</span>`);
  const outs = w.map((t, i) => `<span><b>${t}</b> ${L('giờ mang', 'now carries')}: ${F.map((f, c) => [r.O[i][c], f]).filter(x => x[0] >= 0.25).map(([v, f]) => `${f} ${v.toFixed(2)}`).join(', ') || L('gần như không gì', 'almost nothing')}</span>`);
  const reading = { sdpa: attn, softmax: attn, av: outs }[stage];
  return mats.map(m => matTable(...m)).join('') + (reading ? `<p class="reading">${reading.join('')}</p>` : '');
}

  const { end, x, xs, m, W, series, names, unit } = chartNow, at = xs[0] + (sx - m.l) / (W - m.l - m.r) * (xs[end] - xs[0]);

const lab = { data: 'Vòng tròn', act: 'relu', opt: 'adam', lr: 3, H: 8, noise: 0, decay: 0, batch: 'all', view: 'train',
  running: false, hist: [], acc: 0, test: [], testAcc: 0, net: null, D: null, T: null, shown: 0, pace: null };
const labImg = document.createElement('canvas');
labImg.width = labImg.height = 280;
const MAX_STEPS = 5000, STEPS_PER_S = 240, STEP_MS = 8; // a run's speed, and the time per frame it may use for steps
// a run stops by itself once it has diverged, solved the task (loss < 0.001) or gone long enough; ▶ then starts a new one
const labDone = () => { const last = lab.hist.at(-1); return !Number.isFinite(last) || last < 1e-3 || lab.hist.length > MAX_STEPS; };

function labReset() {

function labStep(k, ms = Infinity) {

  for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) {

function segRefresh() {
  const sec = panel.querySelector('section.seg');
  if (sec) {
    const s = segNow(), lesion = s.G.reduce((a, b) => a + b, 0);
    for (const k of ['r', 'shift']) { sec.querySelector(`#seg-${k}`).value = seg[k]; sec.querySelector(`#o-seg-${k}`).textContent = seg[k] + ' px'; }
    for (const k of ['none', 'blob']) sec.querySelector(`[data-segdo="${k}"]`).setAttribute('aria-pressed', String(seg[k]));
    for (const k in segFmt) sec.querySelector(`[data-m="${k}"]`).textContent = segFmt[k](s.m[k]);
    sec.querySelector('.seg-share').textContent = L(`Tổn thương: ${lesion} trên ${s.N * s.N} pixel (${(100 * lesion / (s.N * s.N)).toFixed(1)}% ảnh).`, `The lesion: ${lesion} of ${s.N * s.N} pixels (${(100 * lesion / (s.N * s.N)).toFixed(1)}% of the image).`);
    sec.querySelector('#seg-view').getContext('2d').drawImage(segImage(), 0, 0);
  }
  if (showsDemo(level, 'seg')) paintLive(level);
}
function segDo(a) {
  if (a === 'ok') Object.assign(seg, { shift: 0, blob: false, none: false });

}

panel.addEventListener('change', e => {

// the block on screen decides the defaults: attention mask by its kind, conv padding/stride by its layer
function syncOwners() {
  const shown = sel ? sel.node : path.at(-1);
  const a = [...path].reverse().find(nd => nd.live === 'sdpa') || level.items.find(it => it.node.live === 'sdpa')?.node;
  if (a && a !== live.owner) { live.owner = a; live.causal = !!a.liveCausal; }
  const c = shown.conv ? shown : level.items.find(it => it.node.conv)?.node;

panel.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.k !== undefined) pick(level.items[+b.dataset.k]);
  else if (b.dataset.add) { if (live.words.length < MAXW) live.words.push(b.dataset.add); refreshLive(); }
  else if (b.dataset.del !== undefined) { if (live.words.length > 1) live.words.splice(+b.dataset.del, 1); refreshLive(); }
  else if (b.dataset.preset !== undefined) { live.words = [...TOY.PRESETS[+b.dataset.preset]]; refreshLive(); }
  else if (b.dataset.img) { conv.img = TOYCONV.IMAGES[b.dataset.img].map(r => [...r]); conv.pick = null; refreshConv(); }
  else if (b.dataset.kernel) { conv.kernel = b.dataset.kernel; conv.pick = null; refreshConv(); }
  else if (b.dataset.px) { const [i, j] = b.dataset.px.split(',').map(Number); conv.img[i][j] ^= 1; refreshConv(); }
  else if (b.dataset.out) { conv.pick = b.dataset.out.split(',').map(Number); refreshConv(); }
  else if (b.dataset.sp) { swin.pick = b.dataset.sp.split(',').map(Number); refreshSwin(); }
  else if (b.dataset.dprompt !== undefined) { dif.prompt = b.dataset.dprompt || null; difRefresh(); }
  else if (b.dataset.dseed) { dif.seed++; difRefresh(); }
  else if (b.dataset.jump) jump(b.dataset.jump);
  else if (b.dataset.lab) labAction(b.dataset.lab);
  else if (b.dataset.smpdo) smpDo(b.dataset.smpdo);
  else if (b.dataset.cnndo || b.dataset.cnnsample) cnnDo(b);
  else if (b.dataset.segdo) segDo(b.dataset.segdo);
  else if (b.dataset.ctpreset) { Object.assign(ct, CT.PRESETS[b.dataset.ctpreset]); ctRefresh(); }
  else if (b.dataset.labset) labSet(b.dataset.labset, b.dataset.val);
  else if (b.dataset.act === 'link') copyLink(b);
  else if (b.dataset.act === 'back') select(null);
  else if (b.dataset.act === 'copy') {
    const code = tr((sel ? sel.node : path.at(-1)).info.code);
    let p;
    try { p = navigator.clipboard.writeText(code); } catch { p = Promise.reject(); }
    p.then(() => { b.textContent = L('Đã chép', 'Copied'); }, () => {
      const r = document.createRange();
      r.selectNodeContents(panel.querySelector('.code code'));
      getSelection().removeAllRanges(); getSelection().addRange(r);
      b.textContent = L('Đã chọn, nhấn Ctrl/⌘ C', 'Selected: press Ctrl/⌘ C');
    });
  }
});

  home.innerHTML = `<div class="home-in">
    <h1 id="home-title">${L('Giải phẫu mạng nơ-ron', 'Neural Network Anatomy')}</h1>
    <p class="home-lede">${L(`Mở từng khối của ${count} mạng nơ-ron trong 3D, từ cả mô hình xuống tới từng phép nhân ma trận. Mỗi khối có shape, công thức, ví dụ số, số tham số, code PyTorch và paper gốc. Nhiều khối chạy số thật ngay trong trang: một CNN đã train trên MNIST đọc chữ số bạn vẽ, một mạng nhỏ học ngay trước mắt, một lát CT qua các cửa sổ HU.`,
      `Open ${count} neural networks block by block in 3D, from the whole model down to a single matrix multiply. Every block has its shapes, formula, a worked example, the parameter count, PyTorch code and the paper it comes from. Many blocks compute for real in the page: a CNN trained on MNIST reads the digit you draw, a small network learns in front of you, a CT slice goes through HU windows.`)}</p>
    <p class="home-links"><a class="home-go" href="#${navCode(PATHS[0].steps[0][1])}">${L('Bắt đầu với ảnh y khoa →', 'Start with medical imaging →')}</a><a href="#transformer">Transformer →</a><a href="?lang=${L('en', 'vi')}" lang="${L('en', 'vi')}">${L('English', 'Tiếng Việt')}</a><a href="${REPO}" target="_blank" rel="noopener">GitHub</a></p>
    <h2>${L('Lộ trình học', 'Learning paths')}</h2>
    <div class="paths">${PATHS.map(p => `<article class="path"><h3>${tr(p.title)}</h3><p>${tr(p.goal)}</p><ol>${p.steps.map(step).join('')}</ol></article>`).join('')}</div>
    <h2>${L('Mọi mạng, theo nhóm', 'Every network, by group')}</h2>
    <div class="home-groups">${GROUPS.map(([g, items]) => `<div class="hg"><h3>${tr(g)}</h3><div>${items.map(s => `<a href="#${navCode(s)}">${navLabel(s)}</a>`).join('')}</div></div>`).join('')}</div>
    <p class="home-foot">${L(`Khối dày là khối có trọng số hoặc đổi shape, lát mỏng giữ nguyên shape. Mỗi khối có link riêng, ví dụ <a href="#transformer.2.0.2">#transformer.2.0.2</a>, để gửi cho người khác. Mã nguồn, cách các con số được kiểm chứng và cách project được làm: xem <a href="${REPO}" target="_blank" rel="noopener">GitHub</a>.`,
      `A thick block has weights or changes the shape; a thin slab keeps the shape. Every block has its own link, such as <a href="#transformer.2.0.2">#transformer.2.0.2</a>, to send to someone. The source code, how the numbers are checked and how the project was built: see <a href="${REPO}" target="_blank" rel="noopener">GitHub</a>.`)}</p>
  </div>`;
}
function showHome(on) {
  home.hidden = !on;
  document.querySelector('.app').inert = on; // keyboard and screen readers stay on the home page
  if (on) { closeFind(); lab.running = false; home.focus({ preventScroll: true }); }
}
function goHome() {
  try { history.pushState(null, '', location.pathname + location.search); } catch { location.hash = ''; return; } // the back button returns to the block
  showHome(true);
}
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', goHome));
const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
addEventListener('keydown', e => {
  if (!home.hidden) return; // the home page is a plain page: the browser's own keys
  // block search: Cmd+F on Apple, Ctrl+F elsewhere (replaces the browser's find-in-page while the page has focus)
  if ((isMac ? e.metaKey : e.ctrlKey) && !e.altKey && e.key.toLowerCase() === 'f') { e.preventDefault(); openFind(); return; }
  if (e.target === findQ) return; // typing in the search field
  if (e.key === 'Escape') sel ? select(null) : goTo(path.length - 2);
});

// ---------- every block of every model: search, "also appears in", links ----------
const ARTIFACT_URL = 'https://claude.ai/artifact/CUkHpKx3VgobxBM3DjXcGa'; // build-pages.sh blanks this: other hosts copy their own address
const INDEX = [];
for (const [key, root] of Object.entries(MODELS)) (function walk(nd, idx, trail) {
  INDEX.push({ key, nd, idx, trail });
  nd.children?.forEach((k, i) => walk(k, [...idx, i], [...trail, nameOf(k)]));
})(root, [], [root.label]);
const CONCEPT_OF = {};
for (const [label, names] of Object.entries(CONCEPTS)) for (const nm of names) (CONCEPT_OF[nm] ||= []).push(label);
// self-check: every name in CONCEPTS must exist, otherwise a link silently disappears
console.assert(Object.keys(CONCEPT_OF).every(nm => INDEX.some(e => e.nd.name === nm)), 'CONCEPTS names a block that does not exist');
// collapse repeats (24 BatchNorms in ResNet) into one entry: first place + count
function groups(entries, keyOf) {
  const m = new Map();
  for (const e of entries) { const k = keyOf(e), g = m.get(k); if (g) g.n++; else m.set(k, { ...e, n: 1 }); }
  return [...m.values()];
}
const modelKey = () => Object.keys(MODELS).find(k => MODELS[k] === path[0]);
const REPO = 'https://github.com/FirstKhoi/visualize-dl'; // feedback goes to this repository's issue form (.github/ISSUE_TEMPLATE/feedback.yml)
const locCode = () => [modelKey(), ...path.slice(1).map((nd, d) => path[d].children.indexOf(nd)), ...(sel ? [path.at(-1).children.indexOf(sel.node)] : [])].join('.');
const parseLoc = code => { const [k, ...rest] = String(code).split('.'); return MODELS[k] ? [k, rest.filter(s => /^\d+$/.test(s)).map(Number)] : null; };
function saveLoc() { try { history.replaceState(null, '', '#' + locCode()); } catch { /* sandboxed history: the copy-link button still works */ } }
function jump(code) {
  const p = parseLoc(code);
  if (!p) return;
  closeFind();
  if (busy) return setTimeout(() => jump(code), 150); // a transition is running: go as soon as it ends
  enter(...p);
}
addEventListener('hashchange', () => { // a link pasted into the same tab, a link on the home page, or the back button
  const h = location.hash.slice(1);
  if (!parseLoc(h)) return showHome(true);
  showHome(false);
  if (h !== locCode()) jump(h);
});

function copyLink(b) {
  const url = (ARTIFACT_URL || location.href.split('#')[0]) + '#' + locCode();
  let p;
  try { p = navigator.clipboard.writeText(url); } catch { p = Promise.reject(); }
  p.then(() => { b.textContent = L('Đã chép link', 'Link copied'); }, () => {
    b.insertAdjacentHTML('afterend', `<input class="linkout" readonly value="${url}" aria-label="${L('Link tới khối này', 'Link to this block')}">`);
    b.nextElementSibling.select();
  });
}

function alsoIn(nd) {
  const labels = CONCEPT_OF[nd.name];
  if (!labels) return '';
  const here = modelKey() + '|' + nd.name;
  return labels.map(label => {
    const gs = groups(INDEX.filter(e => CONCEPTS[label].includes(e.nd.name)), e => e.key + '|' + e.nd.name).filter(g => g.key + '|' + g.nd.name !== here);
    return gs.length ? `<p class="kids-hint">${tr(label)}</p><div class="xlinks">${gs.slice(0, 12).map(g => `<button type="button" class="xl" data-jump="${g.key}.${g.idx.join('.')}"><b>${tr(MODELS[g.key].label)}</b> ${g.trail.slice(1).map(tr).join(' › ')}${g.n > 1 ? ` <span>×${g.n}</span>` : ''}</button>`).join('')}</div>` : '';
  }).join('');
}

// search: accent-insensitive ("chuan hoa" finds "Chuẩn hoá"), over names, categories and concepts
const fold = s => s.normalize('NFD').replace(/\p{M}/gu, '').replace(/[Đđ]/g, 'd').toLowerCase(); // \p{M} = every combining accent mark
const SEARCH = groups(INDEX, e => e.key + '|' + e.nd.name + '|' + e.trail.at(-2)).map(g => ({ ...g,
  name: fold(g.nd.name + ' ' + (g.nd.tag || '') + (EN ? ' ' + tr(g.nd.name) : '')), concept: fold((CONCEPT_OF[g.nd.name] || []).map(c => c + (EN ? ' ' + tr(c) : '')).join(' ')), cat: fold(CAT[g.nd.cat]) })); // English names are searchable too
const findQ = document.getElementById('find-q'), findList = document.getElementById('find-list'), findBox = findQ.parentElement;
const touchOnly = matchMedia('(hover: none) and (pointer: coarse)').matches; // a phone or tablet without a keyboard: no shortcut to show
findQ.placeholder = L('Tìm khối…', 'Search…') + (touchOnly ? '' : ` (${isMac ? '⌘F' : 'Ctrl F'})`);
if (!touchOnly) findQ.setAttribute('aria-keyshortcuts', isMac ? 'Meta+F' : 'Control+F');
let findRes = [], findAt = 0;
function showList(on) {
  findList.hidden = !on;
  findQ.setAttribute('aria-expanded', on);
  if (!on) return;
  findList.style.left = '0';
  const over = findList.getBoundingClientRect().right - view.getBoundingClientRect().right + 8; // the 3D view clips overflow: shift left instead
  if (over > 0) findList.style.left = -over + 'px';
}
function renderFind() {
  const f = fold(findQ.value.trim());
  findRes = !f ? [] : SEARCH.map(s => ({ s, r: s.name.startsWith(f) ? 0 : s.name.includes(f) ? 1 : s.concept.includes(f) ? 2 : s.cat.includes(f) ? 3 : 9 }))
    .filter(x => x.r < 9).sort((a, b) => a.r - b.r || a.s.trail.length - b.s.trail.length).slice(0, 40).map(x => x.s);
  findAt = 0;
  findList.innerHTML = findRes.length ? findRes.map((s, i) => `<button type="button" role="option" id="fr-${i}" class="fr" data-jump="${s.key}.${s.idx.join('.')}" aria-selected="${i === 0}">`
    + `<span class="fr-name">${tr(s.nd.name)}${s.n > 1 ? ` <i>×${s.n}</i>` : ''}</span><span class="fr-trail"><b>${tr(MODELS[s.key].label)}</b>${s.trail.length > 2 ? ' › ' + s.trail.slice(1, -1).map(tr).join(' › ') : ''}</span></button>`).join('')
    : `<p class="finder-empty">${L('Không có khối nào khớp. Thử tên khối, khái niệm hoặc loại, có dấu hay không dấu đều được: "chuan hoa", "residual", "RoPE".', 'No block matches. Try a block name, a concept or a kind: "normalisation", "residual", "RoPE".')}</p>`;
  showList(!!f);
}
function markFind() {
  findList.querySelectorAll('.fr').forEach((b, i) => b.setAttribute('aria-selected', i === findAt));
  findList.querySelector(`#fr-${findAt}`)?.scrollIntoView({ block: 'nearest' });
}
function openFind() { findQ.focus(); findQ.select(); if (findQ.value.trim()) renderFind(); }
function closeFind() { showList(false); findQ.value = ''; findQ.blur(); }
findQ.addEventListener('input', renderFind);
findQ.addEventListener('focus', () => { if (findQ.value.trim()) renderFind(); });
findQ.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (findRes.length) { findAt = (findAt + (e.key === 'ArrowDown' ? 1 : findRes.length - 1)) % findRes.length; markFind(); } }
  else if (e.key === 'Enter' && findRes[findAt]) jump(`${findRes[findAt].key}.${findRes[findAt].idx.join('.')}`);
  else if (e.key === 'Escape') { e.stopPropagation(); closeFind(); } // Esc here closes the search, it must not also go up a level
});
findList.addEventListener('click', e => { const b = e.target.closest('[data-jump]'); if (b) jump(b.dataset.jump); });
document.addEventListener('pointerdown', e => { if (!findBox.contains(e.target)) showList(false); }); // a click elsewhere folds the list

// ---------- picking ----------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function hit(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const meshes = level.items.filter(it => it.alpha > 0.6).flatMap(it => it.body.children.filter(o => o.isMesh));
  return ray.intersectObjects(meshes, false)[0]?.object.userData.item;
}
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 6 && !busy) { const it = hit(e); if (it) pick(it); else if (sel) select(null); }
  down = null;
});
renderer.domElement.addEventListener('pointermove', e => { if (!e.buttons && !busy) setHover(hit(e)); });

// ---------- boot ----------
function onTheme() {
  readTheme();
  labDraw(); // the boundary image is painted in theme colours; buildLevel copies it onto the 3D block
  if (!level || busy) return;
  const old = level, s = sel?.node;
  level = buildLevel(path.at(-1));
  scene.add(level.group);
  level.items.forEach(it => setOp(it, 1)); level.links.forEach(l => setOp(l, 1));
  dispose(old);
  sel = hover = null;
  const again = level.items.find(it => it.node === s);
  if (again) select(again);
  else LIVE[path.at(-1).live]?.mount?.(); // the panel stays: repaint its canvases in the new colours
  grid.position.y = level.floor;
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

new ResizeObserver(() => {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); css.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (level) fit(level, 0);
  labelsMoved();
}).observe(view);

// block labels that land on top of each other on screen (narrow screens, some camera angles) move apart: once the view
// has settled, each label that touches one already placed slides down below it
let labelsDirty = false, labelsAt = 0;
function labelsMoved() { labelsDirty = true; labelsAt = performance.now(); }
controls.addEventListener('change', labelsMoved);
function spreadLabels() {
  const tags = level.items.filter(it => it.el && !it.node.float).map(it => it.el.firstChild);
  tags.forEach(t => { t.style.translate = ''; });
  const boxes = tags.map(t => ({ t, r: t.getBoundingClientRect() })).filter(b => b.r.width > 0).sort((a, b) => a.r.top - b.r.top || a.r.left - b.r.left);
  const placed = [], touch = (a, b, dy) => a.left < b.right + 2 && b.left < a.right + 2 && a.top + dy < b.bottom + 2 && b.top < a.bottom + dy + 2;
  for (const { t, r } of boxes) {
    let dy = 0;
    for (let n = 0, hit; n < placed.length && (hit = placed.find(p => touch(r, p, dy))); n++) dy = hit.bottom + 2 - r.top;
    if (dy) t.style.translate = `0 ${dy}px`;
    placed.push({ left: r.left, right: r.right, top: r.top + dy, bottom: r.bottom + dy });
  }
}

renderer.setAnimationLoop(now => {
  for (const tw of tweens) {
    const k = tw.ms ? Math.min(1, (now - tw.t0) / tw.ms) : 1;
    tw.fn(k);
    if (k === 1) { tweens.delete(tw); tw.done(); }
  }
  if (lab.running) { // full-batch steps at STEPS_PER_S; the panel and the 3D heatmaps refresh ~8 times a second
    labStep(lab.pace(now), STEP_MS);
    if (now - lab.shown > 120 || !lab.running) { lab.shown = now; labUI(); }
  }
  if (level && !reduce) for (const l of level.links) {
    const u = (l.phase + (now * 0.0011) / l.len) % 1;
    l.pulse.position.copy(l.curve.getPointAt(backward ? 1 - u : u));
    l.pulse.scale.setScalar(backward && (l.kind === 'skip' || l.kind === 'short') ? 1.8 : 1); // the shortcut carries the gradient whole
  }
  controls.update();
  if (!home.hidden) return; // nothing of the 3D view shows under the home page
  renderer.render(scene, camera);
  css.render(scene, camera);
  if (level && labelsDirty && !tweens.size && now - labelsAt > 150) { labelsDirty = false; spreadLabels(); }
});

readTheme();
labReset();
labDraw(); // before the first level is built, so the boundary block has a picture to copy
renderHome();
const first = parseLoc(location.hash.slice(1)); // a link like …#llm.2.1 opens that block; no link, the home page
if (first) enter(...first); else showHome(true);
</script>
